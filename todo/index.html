<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do — Sharon Santos</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            font-family: 'EB Garamond', Georgia, serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Auth ─────────────────────────────────── */
        #authScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        #authScreen h1 {
            font-size: 38px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        #authScreen p {
            font-size: 17px;
            font-style: italic;
            color: #666;
            margin-bottom: 28px;
        }

        #passcodeInput {
            width: 200px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        #passcodeInput:focus { border-color: rgba(255,255,255,0.5); }

        #unlockBtn {
            width: 200px;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #unlockBtn:hover { opacity: 0.85; }

        #authError {
            color: #f87171;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        /* ── Main ─────────────────────────────────── */
        #app {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 18px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 400;
        }

        #syncStatus {
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            color: #444;
            transition: color 0.3s;
        }

        #syncStatus.saving { color: #60a5fa; }
        #syncStatus.synced { color: #34d399; }
        #syncStatus.error  { color: #f87171; }

        /* ── Input ─────────────────────────────────── */
        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 18px;
            outline: none;
            transition: border-color 0.2s;
        }

        #taskInput:focus { border-color: rgba(255,255,255,0.4); }
        #taskInput::placeholder { color: #333; }

        #addBtn {
            padding: 0 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            transition: opacity 0.2s;
            line-height: 1;
        }

        #addBtn:hover { opacity: 0.8; }

        /* ── Task List ─────────────────────────────── */
        #taskList {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            animation: fadeIn 0.18s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .task:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }

        .task.done { opacity: 0.38; }

        /* Checkbox */
        .check {
            width: 18px;
            height: 18px;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .task.done .check {
            background: #fff;
            border-color: #fff;
        }

        .task.done .check::after {
            content: '';
            width: 4px;
            height: 8px;
            border: 2px solid #000;
            border-top: none;
            border-left: none;
            transform: rotate(40deg) translateY(-1px);
            display: block;
        }

        /* Text */
        .task-text {
            flex: 1;
            font-size: 18px;
            color: #fff;
            line-height: 1.4;
            word-break: break-word;
        }

        .task.done .task-text {
            text-decoration: line-through;
            color: #444;
        }

        /* Delete */
        .del {
            background: none;
            border: none;
            color: #1e1e1e;
            font-size: 18px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            font-family: -apple-system, sans-serif;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .task:hover .del { color: #444; }
        .del:hover { color: #f87171 !important; }

        /* ── Empty ─────────────────────────────────── */
        #emptyState {
            text-align: center;
            padding: 60px 20px;
            color: #333;
            font-size: 18px;
            font-style: italic;
            display: none;
        }

        /* ── Footer ────────────────────────────────── */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer a {
            font-size: 14px;
            color: #444;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover { color: #fff; }
    </style>
</head>
<body>

<!-- Auth -->
<div id="authScreen">
    <h1>To-Do</h1>
    <p>Enter passcode to continue</p>
    <input type="password" id="passcodeInput" placeholder="••••" maxlength="8" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <div id="authError">Wrong passcode.</div>
</div>

<!-- App -->
<div id="app">
    <div class="header">
        <h1>To-Do</h1>
        <span id="syncStatus">—</span>
    </div>

    <div class="add-row">
        <input type="text" id="taskInput" placeholder="Add a task…" maxlength="300" autocomplete="off">
        <button id="addBtn">+</button>
    </div>

    <div id="taskList"></div>
    <div id="emptyState">Nothing here yet.</div>

    <div class="footer">
        <a href="/private">🐋 Training</a>
        <a href="/">← Home</a>
    </div>
</div>

<script>
    // ── Auth ──────────────────────────────────────────────────────────
    const HASH = "e4782cfc2b471cd4e24686f692188416d8a313cccb62679dc08c348447c2507b";

    async function sha256(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function tryUnlock() {
        const val = document.getElementById('passcodeInput').value.trim();
        if (!val) return;
        const h = await sha256(val);
        if (h === HASH) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            init();
        } else {
            document.getElementById('authError').style.display = 'block';
        }
    }

    document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
    document.getElementById('passcodeInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') tryUnlock();
    });

    // ── Cloud Config ──────────────────────────────────────────────────
    const GH_TOKEN = atob("Z2hwX3pITXdXQ0VHb0lmZXNJNHJMSEU4c2I5UEZ4eUtDYzFCV0VhTA==");
    const GH_API   = "https://api.github.com/repos/sharonsantose/photography-portfolio/contents/private/todo_data.json";

    let fileSha   = null;
    let isSyncing = false;

    // ── Base64 UTF-8 helpers (Safari-safe) ───────────────────────────
    function b64Decode(str) {
        const bin = atob(str.replace(/\s/g, ''));
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    function b64Encode(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }

    // ── Sync status indicator ─────────────────────────────────────────
    function setStatus(text, cls) {
        const el = document.getElementById('syncStatus');
        el.textContent = text;
        el.className = cls || '';
    }

    // ── State ─────────────────────────────────────────────────────────
    const KEY = 'sharon_todo_v3';

    function loadLocal() {
        try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
    }

    function saveLocal(todos) {
        localStorage.setItem(KEY, JSON.stringify(todos));
    }

    // ── Render ────────────────────────────────────────────────────────
    function render() {
        const todos = loadLocal();
        const list  = document.getElementById('taskList');
        const empty = document.getElementById('emptyState');

        list.innerHTML = '';

        if (todos.length === 0) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        todos.forEach(todo => {
            const div = document.createElement('div');
            div.className = 'task' + (todo.done ? ' done' : '');

            const check = document.createElement('div');
            check.className = 'check';

            const text = document.createElement('span');
            text.className = 'task-text';
            text.textContent = todo.text;

            const del = document.createElement('button');
            del.className = 'del';
            del.textContent = '×';
            del.title = 'Delete';
            del.addEventListener('click', e => {
                e.stopPropagation();
                deleteTask(todo.id);
            });

            div.addEventListener('click', () => toggleTask(todo.id));

            div.appendChild(check);
            div.appendChild(text);
            div.appendChild(del);
            list.appendChild(div);
        });
    }

    // ── Add ───────────────────────────────────────────────────────────
    function addTask() {
        const input = document.getElementById('taskInput');
        const text  = input.value.trim();
        if (!text) return;

        const todos = loadLocal();
        todos.unshift({ id: Date.now(), text, done: false });
        saveLocal(todos);
        render();
        push(todos);
        input.value = '';
    }

    // ── Toggle ────────────────────────────────────────────────────────
    function toggleTask(id) {
        const todos = loadLocal().map(t => t.id === id ? { ...t, done: !t.done } : t);
        saveLocal(todos);
        render();
        push(todos);
    }

    // ── Delete ────────────────────────────────────────────────────────
    function deleteTask(id) {
        const todos = loadLocal().filter(t => t.id !== id);
        saveLocal(todos);
        render();
        push(todos);
    }

    // ── Pull from GitHub ──────────────────────────────────────────────
    async function pull() {
        if (isSyncing) return;
        isSyncing = true;
        try {
            const resp = await fetch(GH_API + '?v=' + Date.now(), {
                headers: {
                    'Authorization': 'token ' + GH_TOKEN,
                    'Accept': 'application/vnd.github.v3+json'
                },
                cache: 'no-store'
            });
            if (!resp.ok) throw new Error(resp.status);
            const data   = await resp.json();
            fileSha      = data.sha;
            const cloud  = JSON.parse(b64Decode(data.content));
            if (Array.isArray(cloud)) {
                saveLocal(cloud);
                render();
                setStatus('synced', 'synced');
            }
        } catch (e) {
            setStatus('offline', 'error');
        } finally {
            isSyncing = false;
        }
    }

    // ── Push to GitHub ────────────────────────────────────────────────
    async function push(todos) {
        if (isSyncing) return;
        isSyncing = true;
        setStatus('saving…', 'saving');
        try {
            // Fetch fresh SHA if we don't have one
            if (!fileSha) {
                const r = await fetch(GH_API + '?v=' + Date.now(), {
                    headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });
                if (r.ok) { const d = await r.json(); fileSha = d.sha; }
            }

            const payload = {
                message: 'sync todos',
                content: b64Encode(JSON.stringify(todos, null, 2))
            };
            if (fileSha) payload.sha = fileSha;

            let resp = await fetch(GH_API, {
                method: 'PUT',
                headers: {
                    'Authorization': 'token ' + GH_TOKEN,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            // Retry once on 409 conflict
            if (resp.status === 409) {
                const r2 = await fetch(GH_API + '?v=' + Date.now(), {
                    headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });
                if (r2.ok) { const d2 = await r2.json(); fileSha = d2.sha; payload.sha = fileSha; }
                resp = await fetch(GH_API, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + GH_TOKEN,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            }

            if (resp.ok) {
                const res = await resp.json();
                fileSha   = res.content ? res.content.sha : fileSha;
                setStatus('synced', 'synced');
            } else {
                throw new Error(resp.status);
            }
        } catch (e) {
            setStatus('error saving', 'error');
        } finally {
            isSyncing = false;
        }
    }

    // ── Init ──────────────────────────────────────────────────────────
    function init() {
        render();
        pull();

        document.getElementById('addBtn').addEventListener('click', addTask);
        document.getElementById('taskInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); addTask(); }
        });

        // Auto-sync every 5 seconds
        setInterval(pull, 5000);

        // Sync when tab becomes visible or window gets focus
        document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
        window.addEventListener('focus', pull);
        window.addEventListener('pageshow', pull);
    }
</script>
</body>
</html>
