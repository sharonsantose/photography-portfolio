<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do — Sharon Santos</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            font-family: 'EB Garamond', Georgia, serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Auth ─────────────────────────────────── */
        #authScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        #authScreen h1 {
            font-size: 38px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        #authScreen p {
            font-size: 17px;
            font-style: italic;
            color: #666;
            margin-bottom: 28px;
        }

        #passcodeInput {
            width: 200px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        #passcodeInput:focus { border-color: rgba(255,255,255,0.5); }

        #unlockBtn {
            width: 200px;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #unlockBtn:hover { opacity: 0.85; }

        #authError {
            color: #f87171;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* ── Loading ──────────────────────────────── */
        #loadingScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 16px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loadingScreen p {
            font-size: 16px;
            font-style: italic;
            color: #555;
        }

        /* ── Main App ─────────────────────────────── */
        #app {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 18px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 400;
        }

        #syncStatus {
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            color: #555;
            transition: color 0.3s;
        }

        #syncStatus.saving { color: #60a5fa; }
        #syncStatus.synced { color: #34d399; }
        #syncStatus.error  { color: #f87171; }

        /* ── Input ─────────────────────────────────── */
        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 18px;
            outline: none;
            transition: border-color 0.2s;
        }

        #taskInput:focus { border-color: rgba(255,255,255,0.4); }
        #taskInput::placeholder { color: #333; }
        #taskInput:disabled { opacity: 0.4; }

        #addBtn {
            padding: 0 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            transition: opacity 0.2s;
            line-height: 1;
        }

        #addBtn:hover { opacity: 0.8; }
        #addBtn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ── Task List ─────────────────────────────── */
        #taskList {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, opacity 0.2s;
            animation: fadeIn 0.18s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .task:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
        .task.done  { opacity: 0.35; }
        .task.busy  { pointer-events: none; opacity: 0.5; }

        /* Checkbox */
        .check {
            width: 18px;
            height: 18px;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .task.done .check {
            background: #fff;
            border-color: #fff;
        }

        .task.done .check::after {
            content: '';
            width: 4px;
            height: 8px;
            border: 2px solid #000;
            border-top: none;
            border-left: none;
            transform: rotate(40deg) translateY(-1px);
            display: block;
        }

        .task-text {
            flex: 1;
            font-size: 18px;
            color: #fff;
            line-height: 1.4;
            word-break: break-word;
        }

        .task.done .task-text {
            text-decoration: line-through;
            color: #444;
        }

        .del {
            background: none;
            border: none;
            color: #1c1c1c;
            font-size: 18px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            font-family: -apple-system, sans-serif;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .task:hover .del { color: #444; }
        .del:hover { color: #f87171 !important; }

        /* ── Empty ─────────────────────────────────── */
        #emptyState {
            text-align: center;
            padding: 60px 20px;
            color: #333;
            font-size: 18px;
            font-style: italic;
            display: none;
        }

        /* ── Footer ────────────────────────────────── */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .footer a {
            font-size: 14px;
            color: #444;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover { color: #fff; }
    </style>
</head>
<body>

<!-- Auth -->
<div id="authScreen">
    <h1>To-Do</h1>
    <p>Enter passcode to continue</p>
    <input type="password" id="passcodeInput" placeholder="••••" maxlength="8" autocomplete="off" autofocus>
    <button id="unlockBtn">Unlock</button>
    <div id="authError">Wrong passcode.</div>
</div>

<!-- Loading -->
<div id="loadingScreen">
    <div class="spinner"></div>
    <p>Loading your list…</p>
</div>

<!-- App -->
<div id="app">
    <div class="header">
        <h1>To-Do</h1>
        <span id="syncStatus">—</span>
    </div>

    <div class="add-row">
        <input type="text" id="taskInput" placeholder="Add a task…" maxlength="300" autocomplete="off">
        <button id="addBtn">+</button>
    </div>

    <div id="taskList"></div>
    <div id="emptyState">Nothing here yet.</div>

    <div class="footer">
        <a href="/private">🐋 Training</a>
        <a href="/">← Home</a>
    </div>
</div>

<script>
    // ── Auth ──────────────────────────────────────────────────────────
    const HASH = "e4782cfc2b471cd4e24686f692188416d8a313cccb62679dc08c348447c2507b";

    async function sha256(str) {
        const buf  = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function tryUnlock() {
        const val = document.getElementById('passcodeInput').value.trim();
        if (!val) return;
        const h = await sha256(val);
        if (h === HASH) {
            document.getElementById('authScreen').style.display  = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';
            await init();
        } else {
            document.getElementById('authError').style.display = 'block';
        }
    }

    document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
    document.getElementById('passcodeInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') tryUnlock();
    });

    // ── Proxy API (Cloudflare Worker — token lives encrypted in Cloudflare, never here) ──
    const PROXY = "https://sharon-todo-proxy.sharon5234.workers.dev";

    let writing = false;  // prevent concurrent writes

    // ── Status indicator ─────────────────────────────────────────────
    function setStatus(text, cls) {
        const el = document.getElementById('syncStatus');
        el.textContent = text;
        el.className   = cls || '';
    }

    // ── Read cloud → return array ─────────────────────────────────────
    async function readCloud() {
        const resp = await fetch(PROXY + '?v=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('read ' + resp.status);
        const data = await resp.json();
        return Array.isArray(data) ? data : data.todos;
    }

    // ── Write array → cloud ───────────────────────────────────────────
    async function writeCloud(todos) {
        if (writing) return;
        writing = true;
        setStatus('saving…', 'saving');
        try {
            const resp = await fetch(PROXY, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(todos)
            });
            if (!resp.ok) throw new Error('write ' + resp.status);
            setStatus('synced', 'synced');
        } catch (e) {
            console.error('writeCloud:', e);
            setStatus('error — try again', 'error');
        } finally {
            writing = false;
        }
    }

    // ── In-memory list (source of truth is always GitHub) ────────────
    let todos = [];

    // ── Render ────────────────────────────────────────────────────────
    function render() {
        const list  = document.getElementById('taskList');
        const empty = document.getElementById('emptyState');
        list.innerHTML = '';

        if (todos.length === 0) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        todos.forEach(todo => {
            const div   = document.createElement('div');
            div.className = 'task' + (todo.done ? ' done' : '');

            const check = document.createElement('div');
            check.className = 'check';

            const text  = document.createElement('span');
            text.className   = 'task-text';
            text.textContent = todo.text;

            const del   = document.createElement('button');
            del.className   = 'del';
            del.textContent = '×';
            del.title       = 'Delete';
            del.addEventListener('click', e => { e.stopPropagation(); deleteTask(todo.id); });

            div.addEventListener('click', () => toggleTask(todo.id));
            div.appendChild(check);
            div.appendChild(text);
            div.appendChild(del);
            list.appendChild(div);
        });
    }

    // ── Add ───────────────────────────────────────────────────────────
    async function addTask() {
        const input = document.getElementById('taskInput');
        const text  = input.value.trim();
        if (!text || writing) return;
        input.value = '';
        todos.unshift({ id: Date.now(), text, done: false });
        render();
        await writeCloud(todos);
    }

    // ── Toggle ────────────────────────────────────────────────────────
    async function toggleTask(id) {
        if (writing) return;
        todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
        render();
        await writeCloud(todos);
    }

    // ── Delete ────────────────────────────────────────────────────────
    async function deleteTask(id) {
        if (writing) return;
        todos = todos.filter(t => t.id !== id);
        render();
        await writeCloud(todos);
    }

    // ── Poll cloud for changes from other devices ─────────────────────
    async function poll() {
        if (writing) return;
        try {
            const cloud = await readCloud();
            if (Array.isArray(cloud)) {
                todos = cloud;
                render();
                setStatus('synced', 'synced');
            }
        } catch (e) {
            // Silent — don't interrupt the user
        }
    }

    // ── Init ──────────────────────────────────────────────────────────
    async function init() {
        try {
            const cloud = await readCloud();
            todos = Array.isArray(cloud) ? cloud : [];
        } catch (e) {
            todos = [];
            setStatus('error loading', 'error');
        }

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        render();
        setStatus('synced', 'synced');

        document.getElementById('addBtn').addEventListener('click', addTask);
        document.getElementById('taskInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); addTask(); }
        });

        // Poll every 5 seconds for changes from other devices
        setInterval(poll, 5000);

        // Also sync when tab becomes visible or window regains focus
        document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
        window.addEventListener('focus', poll);
        window.addEventListener('pageshow', poll);
    }
</script>
</body>
</html>
