name: Sync Google Calendar Events

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-gcal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Google Calendar events
        env:
          GCAL_CLIENT_ID:     ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
          GCAL_REFRESH_TOKEN: ${{ secrets.GCAL_REFRESH_TOKEN }}
        run: python scripts/fetch_gcal.py

      - name: Commit and push updated Google Calendar events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fit/gcal_imported_events.json
          git diff --cached --quiet || git commit -m "chore: sync Google Calendar events [skip ci]"
          git push
