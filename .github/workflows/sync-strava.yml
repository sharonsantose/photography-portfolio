name: Sync Strava Workouts

on:
  schedule:
    # Run every day at 9 AM PT (4 PM UTC) — after morning workouts are uploaded
    - cron: '0 16 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write  # needed to commit strava_data.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Strava activities
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/fetch_strava.py

      - name: Update STRAVA_REFRESH_TOKEN secret if rotated
        if: ${{ hashFiles('new_refresh_token.txt') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN=$(cat new_refresh_token.txt)
          gh secret set STRAVA_REFRESH_TOKEN --body "$NEW_TOKEN" --repo ${{ github.repository }}
          echo "Refresh token updated in GitHub Secrets."

      - name: Commit and push strava_data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add private/strava_data.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: sync Strava workouts [skip ci]"
          git push
