name: Sync Garmin Health & Workouts

on:
  schedule:
    # Run twice daily: 9 AM PT (16:00 UTC) and 8 PM PT (03:00 UTC)
    - cron: '0 16 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: fit-data-sync
  cancel-in-progress: false

jobs:
  sync-garmin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect==0.3.11

      - name: Fetch Garmin data
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS:   ${{ secrets.GARMIN_TOKENS }}
        run: python scripts/fetch_garmin.py

      - name: Update dataset used by /fit
        run: python scripts/update_fit_dataset.py

      - name: Update GARMIN_TOKENS secret if rotated
        if: ${{ hashFiles('new_garmin_tokens.txt') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set GARMIN_TOKENS < new_garmin_tokens.txt --repo ${{ github.repository }}
          echo "Garmin session tokens updated in GitHub Secrets."

      - name: Commit and push updated Garmin data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add private/garmin_data.json private/todo_data.json fit/garmin_dataset.json
          git diff --cached --quiet || git commit -m "chore: sync Garmin health & workouts [skip ci]"
          git pull --rebase origin main
          git push
