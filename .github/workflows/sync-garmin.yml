    name: Sync Garmin Health & Workouts                                        
                                                                               
    on:                                                                        
      schedule:                                                                
        # Run twice daily: 9 AM PT (16:00 UTC) and 8 PM PT (03:00 UTC)         
        - cron: '0 16 * * *'                                                   
        - cron: '0 3 * * *'                                                    
      workflow_dispatch:  # Allow manual trigger from GitHub Actions tab       
                                                                               
    permissions:                                                               
      contents: write                                                          
                                                                               
    jobs:                                                                      
      sync-garmin:                                                             
        runs-on: ubuntu-latest                                                 
                                                                               
        steps:                                                                 
          - name: Checkout repo                                                
            uses: actions/checkout@v4                                          
                                                                               
          - name: Set up Python                                                
            uses: actions/setup-python@v5                                      
            with:                                                              
              python-version: '3.11'                                           
                                                                               
          - name: Install dependencies                                         
            run: |                                                             
              python -m pip install --upgrade pip                              
              pip install garminconnect                                        
                                                                               
          - name: Fetch Garmin data                                            
            env:                                                               
              GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}                     
              GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}                  
            run: python scripts/fetch_garmin.py                                
                                                                               
          - name: Commit and push updated Garmin data                          
            run: |                                                             
              git config user.name  "github-actions[bot]"                      
              git config user.email "github-actions[bot]@users.noreply.github. 
  com"                                                                         
              git add private/garmin_data.json private/todo_data.json          
              git diff --cached --quiet || git commit -m "chore: sync Garmin   
  health & workouts [skip ci]"                                                 
              git push 
